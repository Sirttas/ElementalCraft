import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'jacoco'
    id 'net.neoforged.moddev' version '2.0.+'

    id 'net.darkhax.curseforgegradle' version '1.1.+'
    id "com.modrinth.minotaur" version "2.+"
}

eclipse {
    classpath {
        downloadSources = true
        downloadJavadoc = true
    }
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

version = project.hasProperty('tag_version') ? "${tag_version}" : "${elementalcraft_version}"
group = 'sirttas.elementalcraft'

repositories {
    mavenCentral()
    maven { url "https://repo.elementalcraft.org/public" }
}

base {
    archivesName = 'elementalcraft'
}

logger.info('Building Elemental Craft: ' + project.version)

java.toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")

ext.lookupModDependancyLocaly = { name ->
    def mod = findProject(":${name}")

    if (mod == null) {
        logger.info("${name} not found locally")
    } else {
        evaluationDependsOn(":${name}")
        logger.info("${name} found locally")
    }
    return mod
}

project.ext.set('dpAnvil', lookupModDependancyLocaly(':DPAnvil'))
if (project.dpAnvil == null) {
    project.ext.set('dpAnvil', lookupModDependancyLocaly(':datapack-anvil'))
} else {
    project.dpAnvil = dpAnvil
}

sourceSets {
    api {
        java {
            srcDir 'src/api/java'
        }
    }
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
    interaction {
        java {
            srcDir 'src/interaction/java'
            exclude 'sirttas/elementalcraft/interaction/curios/**'
            exclude 'sirttas/elementalcraft/interaction/ie/**'
            exclude 'sirttas/elementalcraft/interaction/mekanism/**'
        }
        resources {
            srcDir 'src/interaction/resources'
        }
    }
    datagen {
        java {
            srcDir 'src/datagen/java'
        }
    }
    test
}

neoForge {
    version = project.neo_version

    addModdingDependenciesTo(sourceSets.api)
    addModdingDependenciesTo(sourceSets.interaction)
    addModdingDependenciesTo(sourceSets.datagen)
    addModdingDependenciesTo(sourceSets.test)

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'fml.earlyprogresswindow', 'false'
            systemProperty 'mixin.debug.verbose', 'true'
            systemProperty 'mixin.env.remapRefMap', 'true'

            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()

            gameDirectory = file('runs/client')
            sourceSet = sourceSets.test
            systemProperty 'forge.enabledGameTestNamespaces', 'elementalcraft'
        }

        server {
            server()

            gameDirectory = file('runs/server')
            sourceSet = sourceSets.test
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', 'elementalcraft'
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file('runs/gameTestServer')
            sourceSet = sourceSets.test
            systemProperty 'forge.enabledGameTestNamespaces', 'elementalcraft'
        }

        data {
            clientData()

            gameDirectory = file('runs/data')
            sourceSet = sourceSets.datagen
            programArguments.addAll '--mod', 'elementalcraft',
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing-mod', 'ae2'
        }

    }

    mods {
        elementalcraft {
            sourceSet(sourceSets.api)
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.interaction)
            sourceSet(sourceSets.datagen)
            sourceSet(sourceSets.test)
        }
        if (project.dpAnvil != null) {
            dpanvil {
                sourceSet(project.dpAnvil.sourceSets.api)
                sourceSet(project.dpAnvil.sourceSets.main)
            }
        }
    }

    unitTest {
        enable()
        testedMod = mods.elementalcraft
    }
}

configurations {
    additionalRuntimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    implementation sourceSets.api.output

    // mod dependencies
    if (project.dpAnvil != null) {
        apiCompileOnly project.dpAnvil.sourceSets.api.output
        compileOnly project.dpAnvil.sourceSets.api.output
        interactionCompileOnly project.dpAnvil.sourceSets.api.output
        testCompileOnly project.dpAnvil.sourceSets.api.output
        datagenCompileOnly project.dpAnvil.sourceSets.api.output
        runtimeOnly project.dpAnvil.sourceSets.main.output
        interactionRuntimeOnly project.dpAnvil.sourceSets.main.output
        testRuntimeOnly project.dpAnvil.sourceSets.main.output
        datagenRuntimeOnly project.dpAnvil.sourceSets.main.output
        implementation(accessTransformers(interfaceInjectionData(project.dpAnvil)))
    } else {
        logger.info("DPAnvil not found locally, looking in maven repo")
        apiCompileOnly "sirttas.dpanvil:DPAnvil:${dpanvil_version}:api"
        compileOnly "sirttas.dpanvil:DPAnvil:${dpanvil_version}:api"
        interactionCompileOnly "sirttas.dpanvil:DPAnvil:${dpanvil_version}:api"
        testCompileOnly "sirttas.dpanvil:DPAnvil:${dpanvil_version}:api"
        datagenCompileOnly "sirttas.dpanvil:DPAnvil:${dpanvil_version}:api"
        runtimeOnly "sirttas.dpanvil:DPAnvil:${dpanvil_version}"
        interactionRuntimeOnly "sirttas.dpanvil:DPAnvil:${dpanvil_version}"
        testRuntimeOnly "sirttas.dpanvil:DPAnvil:${dpanvil_version}"
        datagenRuntimeOnly "sirttas.dpanvil:DPAnvil:${dpanvil_version}"
    }

    compileOnly "vazkii.patchouli:patchouli-neoforge:${patchouli_version}:api"
    runtimeOnly "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"
    
    // mod interactions
    interactionImplementation sourceSets.api.output
    interactionImplementation sourceSets.main.output

    interactionImplementation "mezz.jei:jei-${jei_suffix}:${jei_version}"

    interactionCompileOnly "vazkii.patchouli:patchouli-neoforge:${patchouli_version}:api"
    interactionCompileOnly "mekanism:Mekanism:${mekanism_version}"
    interactionCompileOnly "blusunrize.immersiveengineering:ImmersiveEngineering:${immersive_engineering_version}"
    interactionImplementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    interactionImplementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    interactionCompileOnly "vazkii.botania:Botania:${botania_version}:api"
    // runtimeOnly "vazkii.botania:Botania:${botania_version}"

    // test
    testImplementation sourceSets.api.output
    testImplementation sourceSets.main.output
    testImplementation sourceSets.interaction.output
    testImplementation "net.neoforged:testframework:${neo_version}"
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "org.mockito:mockito-core:${mockito_version}"
    testImplementation "org.assertj:assertj-core:${assertj_version}"
    localRuntime "org.assertj:assertj-core:${assertj_version}"

    // datagen
    datagenImplementation sourceSets.api.output
    datagenImplementation sourceSets.main.output
    datagenImplementation sourceSets.interaction.output
    datagenImplementation "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"
    datagenImplementation "mekanism:Mekanism:${mekanism_version}"
    datagenImplementation "blusunrize.immersiveengineering:ImmersiveEngineering:${immersive_engineering_version}"
    datagenImplementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    datagenImplementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    datagenImplementation "vazkii.botania:Botania:${botania_version}:api"
    // datagenImplementation "vazkii.botania:Botania:${botania_version}"
    datagenImplementation("net.silentchaos512:silent-gear-${silentgear_suffix}:${silentgear_version}")
    datagenImplementation("net.silentchaos512:silent-lib-${silentlib_suffix}:${silentlib_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            pack_format_number: pack_format_number,

            dpanvil_version: dpanvil_version,
            dpanvil_version_range: dpanvil_version_range,
            patchouli_version_range: patchouli_version_range,
            jei_version_range: jei_version_range,
            mekanism_version_range: mekanism_version_range,
            curios_version_range: curios_version_range,

            elementalcraft_version: elementalcraft_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

jar {
	from sourceSets.api.output
    from sourceSets.main.output
    from sourceSets.interaction.output

    manifest {
        attributes([
            "Specification-Title": "ElementalCraft",
            "Specification-Vendor": "elementalcraft",
            "Specification-Version": "${version}",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"elementalcraft",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

task apiJar(type: Jar) {
    archiveClassifier = "api"
    from sourceSets.api.output
}

task datagenJar(type: Jar) {
    archiveClassifier = "datagen"
    from sourceSets.datagen.output
}

task sourcesJar(type: Jar) {
    archiveClassifier = "sources"
    from sourceSets.api.allSource
    from sourceSets.main.allSource
    from sourceSets.interaction.allSource
    from sourceSets.datagen.allSource
    from sourceSets.test.allSource
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

build.dependsOn tasks.apiJar
build.dependsOn tasks.sourcesJar
build.dependsOn tasks.datagenJar

test {
    useJUnitPlatform()
    jacoco {
        includeNoLocationClasses = true
        includes = ["sirttas.elementalcraft.*"]
    }
}
jacoco {
    toolVersion = "${jacoco_version}"
}
jacocoTestReport {
    dependsOn 'runJunit'
    dependsOn 'runGameTestServer'
    reports {
        xml.required.set(true)
    }
    getExecutionData().setFrom(fileTree(layout.buildDirectory).include("/jacoco/*.exec"))
}
tasks.configureEach {
    if (it.name == 'runJunit' || it.name == 'runGameTestServer') {
        JacocoPluginExtension jacoco = project.extensions.getByType(JacocoPluginExtension)

        jacoco.applyTo(it)
        it.extensions.configure(JacocoTaskExtension) { extension ->
            extension.includeNoLocationClasses = true
            extension.includes = ["sirttas.elementalcraft.*"]
        }
    }
}

def modmaven_user = System.getenv("MODMAVEN_USER") ?: project.findProperty("modmaven_user")
def modmaven_password = System.getenv("MODMAVEN_PASSWORD") ?: project.findProperty("modmaven_password")
def use_modmaven = modmaven_user != null && modmaven_password != null
def elemental_craft_repo_user = System.getenv("ELEMENTAL_CRAFT_REPO_USER") ?: project.findProperty("elemental_craft_repo_user")
def elemental_craft_repo_password = System.getenv("ELEMENTAL_CRAFT_REPO_PASSWORD") ?: project.findProperty("elemental_craft_repo_password")
def use_elemental_craft_repo = project.findProperty("enable_elemental_craft_repo").toBoolean() && elemental_craft_repo_user != null && elemental_craft_repo_password != null

if (use_modmaven || use_elemental_craft_repo) {
    if (use_modmaven) {
        logger.info("Maven publish setup for modmaven")
    }
    if (use_elemental_craft_repo) {
        logger.info("Maven publish setup for elementalcraft repo")
    }
	publishing {
	    publications {
	        mavenJava(MavenPublication) {
	        	artifactId = 'ElementalCraft'
				artifacts = [apiJar, jar, sourcesJar, datagenJar]
	        }
	    }
	    
	    repositories {
            if (use_modmaven) {
                maven {
                    name = "ModMaven"
                    url = 'https://modmaven.dev/artifactory/local-releases/'
                    credentials {
                        username = modmaven_user
                        password = modmaven_password
                    }
                }
            }
            if (use_elemental_craft_repo) {
                maven {
                    name = "ElementalCraftRepo"
                    url = 'https://repo.elementalcraft.org/releases'
                    credentials {
                        username = elemental_craft_repo_user
                        password = elemental_craft_repo_password
                    }
                }
            }
	    }
	}
}

def curseforge_key = System.getenv("CURSEFORGE_KEY") ?: project.findProperty("curseforge_key")
def modrinth_token = System.getenv("MODRINTH_TOKEN") ?: project.findProperty("modrinth_token")
def changeLog
def releaseVersions = List.of(project.getProperty("release_versions").split(","))

if (curseforge_key != null || modrinth_token != null) {
    def generatedChangelog = ""
    def changeStart = false
    def changeEnd = false

    logger.info('Changelog:')

    file('changelog.txt').withReader { reader ->
        def line

        while ((line = reader.readLine()) != null && !changeEnd) {
            if (line ==~ '^\\s*- .*') {
                changeStart = true
            } else if (changeStart) {
                changeEnd = true
            }
            if (changeStart && !changeEnd) {
                logger.info(line)
                generatedChangelog += line + '\n'
            }
        }
    }
    changeLog = generatedChangelog
}

if (curseforge_key != null) {
    tasks.register("curseforge", TaskPublishCurseForge, { task ->
        apiToken = curseforge_key

        task.upload(395158, jar) { main ->
            releaseType = "${release_type}"
            addModLoader('NeoForge')
            changelog = changeLog
            releaseVersions.each { v -> addGameVersion(v) }
            addRequirement('datapack-anvil')
            addRequirement('patchouli')
            addOptional('jei')
            addOptional('curios')
            addIncompatibility('performant')
        }
	})
}

if (modrinth_token != null) {
    modrinth {
        token = modrinth_token
        projectId = "o51LXm0t"
        versionNumber = project.version
        versionType = "${release_type}"
        uploadFile = jar
        gameVersions = releaseVersions
        loaders.addAll("neoforge")
        changelog = changeLog
        dependencies {
            required.project "dpanvil"
            required.project "patchouli"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
